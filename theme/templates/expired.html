{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 text-center animate-fade-in-up">
    <div class="bg-white rounded-xl shadow-lg border border-red-100 p-8">
        <div class="w-20 h-20 bg-gradient-to-br from-red-100 to-red-200 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-red-600 mb-4">連結已過期</h1>
        <p class="text-gray-600 mb-6">
            短網址 <code class="bg-gray-100 px-2 py-1 rounded font-mono text-purple-700">{{ short_code }}</code> 已經過期，無法存取。
        </p>
        <a href="{% url 'home' %}"
           class="btn-cta-gradient text-white font-semibold px-6 py-3 rounded-lg cursor-pointer focus-ring inline-flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            返回首頁
        </a>
    </div>
</div>
{% endblock %}
