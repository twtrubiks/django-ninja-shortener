
x-base-app-setting: &x-base-app
  image: ninja-shortener-app
  build: .
  volumes:
    - .:/ninja_shortener
  # 機敏設定改由環境變數注入；未設定時沿用與程式內建一致的開發預設值。
  # 可在專案根目錄建立 .env（compose 會自動讀取）覆蓋這些值。
  environment:
    - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
    - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
    - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
    - POSTGRES_DB=${POSTGRES_DB:-postgres}
    - POSTGRES_USER=${POSTGRES_USER:-myuser}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
    - POSTGRES_HOST=${POSTGRES_HOST:-django-postgres}
    - POSTGRES_PORT=${POSTGRES_PORT:-5432}

services:

    test:
      # 這個服務專門用來跑測試
      # docker compose up   # 啟動常規服務，跳過測試。
      # docker compose up test # 只運行測試及其直接依賴。
      # docker compose --profile testing up # 啟動所有 被標記 profile: "testing" 的服務
      <<: *x-base-app
      command: bash -c "pytest --cov=. --cov-report=html"
      # command: bash -c "pytest -s" # print log
      profiles:
        - "testing"

    migrate:
      # 一次性「釋出」容器：集中跑 migrate（+ 建快取表），跑完即退出。
      # django-ninja / qcluster 以 service_completed_successfully 等它完成，
      # 與 prod 對等，避免多個容器開機各自 migrate 的並發競態。
      # dev 用 runserver + staticfiles finders 服務靜態檔，故不需 collectstatic。
      <<: *x-base-app
      command: >
        bash -c "python manage.py migrate &&
                 python manage.py createcachetable"
      restart: "no"
      depends_on:
        django-postgres:
          # 等到 healthcheck 通過（能接受連線）才跑 migrate，
          # 避免 Postgres 尚未就緒導致 migrate 連線失敗退出、整組服務起不來。
          condition: service_healthy

    django-ninja:
      <<: *x-base-app
      command: bash -c "python manage.py runserver 0.0.0.0:8000"
      restart: always
      ports:
        - "8000:8000"
      depends_on:
        tailwind:
          # 關鍵：不僅是啟動，而是要等到 tailwind 服務健康後
          condition: service_healthy

        # 對於 django-postgres，只需要等待它啟動即可
        django-postgres:
          condition: service_started

        # 等 migrate 一次性服務跑完，schema 就緒後才啟動
        migrate:
          condition: service_completed_successfully

    qcluster:
      # Django-Q2 背景 worker：處理 OG 抓取等非同步任務
      <<: *x-base-app
      command: bash -c "python manage.py qcluster"
      restart: "unless-stopped"
      depends_on:
        django-postgres:
          condition: service_started
        migrate:
          condition: service_completed_successfully

    django-postgres:
      image: postgres:18
      # ports:
      #   - "5432:5432"
      environment:
        - POSTGRES_DB=${POSTGRES_DB:-postgres}
        - POSTGRES_USER=${POSTGRES_USER:-myuser}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
        - PGDATA=/var/lib/postgresql/data/pgdata
      volumes:
        - db-data:/var/lib/postgresql/data/pgdata
      healthcheck:
        # -h 127.0.0.1 強制走 TCP：initdb 階段的暫存伺服器只聽 unix socket，
        # 走 TCP 檢查可避免初始化尚未完成就被誤判為健康。
        test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
        # 首次啟動需跑 initdb，較耗時；這段期間的失敗不計入 retries
        start_period: 30s

    tailwind:
      <<: *x-base-app
      restart: "unless-stopped"
      command: >
        bash -c "python manage.py tailwind install &&
                 python manage.py tailwind build &&
                 touch /tmp/tailwind.ready &&
                 python manage.py tailwind start"

      # Without tty, no stdin, and tailwind watcher aborts
      # https://github.com/tailwindlabs/tailwindcss/issues/5324
      tty: true

      # 關鍵：新增 healthcheck 來檢查信號檔案
      healthcheck:
        # 檢查 /tmp/tailwind.ready 檔案是否存在
        test: ["CMD", "test", "-f", "/tmp/tailwind.ready"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  db-data: